[package]
name = "grimoire-tui"
version.workspace = true
edition = "2024"
description = "A terminal writing desk for novels"
authors = ["Josh King"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/kelsierbot/GrimoireTUI"
homepage = "https://grimoiretui.com"
keywords = ["tui", "writing", "novel", "markdown", "editor"]
categories = ["command-line-utilities", "text-editors"]

# The published crate is `grimoire-tui`; the command you type is `grimoire`.
[[bin]]
name = "grimoire"
path = "src/main.rs"

[dependencies]
grimoire-core = { path = "crates/grimoire-core", version = "0.7" }
wros-sys = { path = "crates/wros-sys" }
wros-shell = { path = "crates/wros-shell" }
anyhow = "1.0.104"
chrono = "0.4.45"
# Same cpal that rodio already pulls in; used directly for loopback capture.
cpal = { version = "0.17", optional = true }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-wav", "symphonia-pcm"], optional = true }
serde_json = "1.0.151"
serde = { version = "1.0", features = ["derive"] }
zeroize = "1.9"
ureq = { version = "3.4.1", features = ["json"] }
# Test builds only (feature test-driver): publishes the Settings page and its rows
# over a private socket, so screen tests choose rows by name.
taria-ratatui = { version = "0.4.0", optional = true }

# Saving on the way out when the terminal window is closed or the machine asks
# the process to stop: SIGHUP/SIGTERM on Unix, the console close event on Windows.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wros-input = { path = "crates/wros-input" }
wros-graphics = { path = "crates/wros-graphics", optional = true }
ratatui-wgpu = { version = "0.6.0", default-features = false, optional = true }
wgpu = { version = "30.0.0", optional = true }
winit = { version = "0.30.13", default-features = false, features = ["wayland", "wayland-dlopen", "rwh_06"], optional = true }
futures-lite = { version = "2.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# `.deb` and `.rpm` packages, built for each release by .github/workflows/packages.yml.
[package.metadata.deb]
name = "grimoire"
maintainer = "Catfinity Studios"
copyright = "Josh King, Catfinity Studios"
section = "editors"
priority = "optional"
extended-description = """\
A writing desk for novels that lives in your terminal: an outline of parts, \
chapters and scenes, a quiet page to write on, notes and TKs, spelling, \
sprints, a Pomodoro, music, and export to Word, PDF, EPUB and paperback. \
Your book is a folder of plain Markdown files. Made by Catfinity Studios, \
makers of Catfinity. https://grimoiretui.com"""
depends = "$auto"
assets = [
    ["target/release/grimoire", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/grimoire/README.md", "644"],
    ["LICENSE", "usr/share/doc/grimoire/LICENSE", "644"],
    ["assets/dict/DICTIONARY-LICENSE", "usr/share/doc/grimoire/DICTIONARY-LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "grimoire"
summary = "A terminal writing desk for novels"
url = "https://grimoiretui.com"
auto-req = "builtin"
assets = [
    { source = "target/release/grimoire", dest = "/usr/bin/grimoire", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/grimoire/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/grimoire/LICENSE", mode = "644", doc = true },
    { source = "assets/dict/DICTIONARY-LICENSE", dest = "/usr/share/licenses/grimoire/DICTIONARY-LICENSE", mode = "644", doc = true },
]

[profile.release]
opt-level = 3
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[features]
# Audio playback for the Jellyfin and Plex sources, and system-audio capture
# for the spectrum view (macOS 14.6+). Default on; on Linux it needs ALSA
# headers (libasound2-dev). Build with --no-default-features to omit it and
# keep the other sources.
default = ["audio", "gui-drm"]
gui-drm = ["dep:wros-graphics", "wros-input/native"]
gui-wgpu = ["dep:ratatui-wgpu", "dep:wgpu", "dep:winit", "dep:futures-lite"]
pty-qa = []
# Never in WrOS packages: a release build with it refuses to compile.
test-driver = ["dep:taria-ratatui"]
audio = ["dep:rodio", "dep:cpal"]

[dev-dependencies]
# The real app in a pseudo-terminal: vt100 reads its screen, insta keeps snapshots.
insta = "1.49"
vt100 = "0.18"

[[test]]
name = "driven"
path = "tests/driven.rs"
required-features = ["test-driver"]

[workspace]
members = ["crates/grimoire-core", "crates/grimoire-app", "crates/wros-sys", "crates/wros-shell", "crates/wros-greeter", "crates/wros-boot", "crates/wros-input", "crates/wros-installer", "crates/wros-graphics"]
exclude = ["crates/crossterm-upstream"]

[patch.crates-io]
crossterm = { path = "crates/crossterm-upstream" }

# One version for the terminal app and the crates under it; bump it here.
[workspace.package]
version = "0.7.5"
