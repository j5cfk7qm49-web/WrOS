<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Finish linking WrOS</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; margin: 0 16px; padding: 32px 0; background: #111; color: #eee; }
  a.button { display: inline-block; padding: 16px 28px; font-size: 20px; background: #3b6; color: #000; border-radius: 10px; text-decoration: none; }
  .note { color: #aaa; font-size: 15px; }
</style>
</head>
<body>
<h1>Finish linking WrOS</h1>
<p id="status">Reading Google's answer…</p>
<p id="finish" hidden><a class="button" id="go" href="#">Finish linking</a></p>
<p class="note" id="note" hidden>Sends Google's approval to your laptop over your Wi-Fi. It only works
together with the laptop that showed the code.</p>
<script>
// Google returns here with ?code=…&state=<address>. The code is useless without the secret
// half of the PKCE pair, which never leaves the laptop. Safari only lets a secure page open
// the laptop's local address after a tap, hence the button.
(function () {
  const status = document.getElementById('status');
  const params = new URLSearchParams(location.search);
  const fragment = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname);  // keep the code out of history and tab sync
  const mailboxState = fragment.get('state') || params.get('state') || '';
  if (mailboxState.startsWith('m.')) {
    return mailbox(status, fragment, params, mailboxState);
  }
  if (params.get('error')) {
    status.textContent = params.get('error') === 'access_denied'
      ? 'Linking was cancelled. Scan the code on the laptop to try again.'
      : 'Google could not link WrOS (' + params.get('error') + '). Scan the code on the laptop to try again.';
    return;
  }
  const code = params.get('code') || '';
  const state = params.get('state') || '';
  if (!/^[\x21-\x7e]{10,512}$/.test(code) || !/^[A-Za-z0-9_-]{8}$/.test(state)) {
    status.textContent = 'This page needs the link from Google. Scan the code on the laptop to start.';
    return;
  }
  const bytes = Array.from(atob(state.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const [a, b, c, d] = bytes;
  const port = bytes[4] * 256 + bytes[5];
  // Only a laptop on the local network, never an address on the internet.
  if (!(a === 10 || (a === 172 && b >= 16 && b <= 31) || (a === 192 && b === 168)) || port < 1024) {
    status.textContent = 'This link does not point at a laptop on your network.';
    return;
  }
  document.getElementById('go').href =
    'http://' + [a, b, c, d].join('.') + ':' + port + '/linked?code=' + encodeURIComponent(code);
  status.textContent = 'Google said yes. One last step:';
  document.getElementById('finish').hidden = false;
  document.getElementById('note').hidden = false;
})();

// No-Wi-Fi linking (from /l2/): Google answered in the fragment with a code for the laptop and a
// short-lived Drive token for this page. The page saves the code as "WrOS linking <key>" in the
// writer's Drive, where the laptop's own limited sign-in finds it, then sends the writer to
// approve that sign-in. The code is useless without the laptop's half of the PKCE pair.
function mailbox(status, fragment, params, state) {
  const [, userCode, challenge, variant] = state.split('.');
  const say = (text) => { status.textContent = text; };
  if (!/^[A-Z0-9-]{6,16}$/.test(userCode || '') || !/^[A-Za-z0-9_-]{43}$/.test(challenge || '')) {
    return say('This page needs the link from Google. Scan the code on the laptop to start.');
  }
  const diag = document.createElement('p');
  diag.className = 'note';
  document.body.appendChild(diag);
  const error = fragment.get('error') || params.get('error');
  if (error) {
    say('Google refused (' + error + '): ' + (fragment.get('error_description') || params.get('error_description') || ''));
    diag.textContent = 'Test variant ' + variant + '.';
    if (variant === 'a') {
      const again = document.createElement('a');
      again.className = 'button';
      again.href = '/WrOS/l2/#' + challenge + '.' + userCode + '.b';
      again.textContent = 'Try the other way';
      document.body.appendChild(again);
    }
    return;
  }
  const code = fragment.get('code') || params.get('code') || '';
  const token = fragment.get('access_token') || '';
  diag.textContent = 'Test variant ' + variant + '. Google sent: laptop code ' + (code ? 'yes' : 'NO')
    + ', phone access ' + (token ? 'yes' : 'NO') + ', in the ' + (fragment.get('code') ? 'fragment' : 'query') + '.';
  if (!code || !token) {
    return say('Google did not send everything this test needs.');
  }
  say('Saving the approval for the laptop…');
  const boundary = 'wros' + Math.random().toString(36).slice(2);
  const meta = { name: 'WrOS linking ' + challenge.slice(0, 16), mimeType: 'text/plain' };
  const body = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta)
    + '\r\n--' + boundary + '\r\nContent-Type: text/plain\r\n\r\n' + code + '\r\n--' + boundary + '--';
  fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=' + boundary },
    body: body,
  }).then((response) => {
    if (!response.ok) {
      return response.text().then((text) => say('Drive refused the save (HTTP ' + response.status + '): ' + text.slice(0, 200)));
    }
    say('Saved. Last step: approve the laptop on Google. Its code is ' + userCode + '.');
    const go = document.createElement('a');
    go.className = 'button';
    go.href = 'https://www.google.com/device?user_code=' + encodeURIComponent(userCode);
    go.textContent = 'Approve the laptop';
    document.body.appendChild(go);
    setTimeout(() => location.assign(go.href), 4000);
  }, (err) => say('Could not reach Drive: ' + err));
}
</script>
</body>
</html>
