# WrOS boot menu (read by update-grub after /etc/default/grub).
# Hidden on a normal boot: Esc during these 2 seconds shows it. After a boot that never reached
# the login screen, /etc/grub.d/06_wros_boot_check shows it for 30 seconds.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
# "WrOS recovery" (/etc/grub.d/42_wros_recovery) replaces Debian's recovery-mode entries, which
# only offer a root shell that the locked root account refuses.
GRUB_DISABLE_RECOVERY=true
# Kernel errors stay off the screen from the first second (firmware ACPI errors print before
# /etc/sysctl.d/60-wros-quiet-console.conf applies). The journal still keeps every message.
case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in *" loglevel="*) ;; *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+${GRUB_CMDLINE_LINUX_DEFAULT} }loglevel=3" ;; esac
# The boot screen (/usr/share/plymouth/themes/wros) shows only where Plymouth is installed.
# (WROS_PLYMOUTHD is for the tests only.)
if [ -x "${WROS_PLYMOUTHD:-/usr/sbin/plymouthd}" ]; then
  case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in *" splash "*|*" nosplash "*) ;; *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+${GRUB_CMDLINE_LINUX_DEFAULT} }splash" ;; esac
fi
