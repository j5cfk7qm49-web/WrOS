# WrOS boot menu (read by update-grub after /etc/default/grub).
# Hidden on a normal boot: Esc during these 2 seconds shows it. After a boot that never reached
# the login screen, /etc/grub.d/06_wros_boot_check shows it for 30 seconds.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
# "WrOS recovery" (/etc/grub.d/42_wros_recovery) replaces Debian's recovery-mode entries, which
# only offer a root shell that the locked root account refuses.
GRUB_DISABLE_RECOVERY=true
