# WrOS: foot as the writing app's full-screen terminal in the graphical session
# (cage runs foot runs grimoire; see os/scripts/wros-session).
[main]
font=DejaVu Sans Mono:size=11
pad=0x0

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors]
foreground=ffffff
background=000000

[key-bindings]
# No new terminal windows: under cage one would cover the writing app with a shell.
spawn-terminal=none
show-urls-launch=none
