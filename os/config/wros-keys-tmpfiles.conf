# The brightness and volume keys (#80): wros-media-key's lock, and the file whose change tells
# the app to read brightness and volume again.
d /run/wros-keys 0755 wros-keys wros-keys -
# Where the ACPI video driver drives the backlight, the kernel also changes brightness on these
# keys; WrOS changes it instead, so a press never moves two steps. Absent driver: nothing written.
w /sys/module/video/parameters/brightness_switch_enabled - - - - N
