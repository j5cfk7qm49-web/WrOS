# WrOS: Realtek rtw88 Wi-Fi (the HP Stream 11's RTL8822BE) stays out of its deep power-saving
# states. With them on, the firmware fails to leave low-power mode ("firmware failed to leave
# lps state") and then stops taking commands ("failed to send h2c command"), dropping Wi-Fi.
# Costs a little battery while Wi-Fi is idle; options for drivers that are not loaded do nothing.
options rtw88_core disable_lps_deep=y
options rtw88_pci disable_aspm=y
