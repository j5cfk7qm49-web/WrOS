# WrOS: Debian's triggerhappy reads WrOS's key triggers only, and runs them as the wros-keys
# account instead of nobody (/usr/lib/sysusers.d/wros-keys.conf). It still opens the input devices
# as root and takes /run/thd.socket from triggerhappy.socket, so new keyboards join as before.
[Service]
ExecStart=
ExecStart=/usr/sbin/thd --triggers /usr/lib/wros/keys/ --socket /run/thd.socket --user wros-keys --deviceglob /dev/input/event*
