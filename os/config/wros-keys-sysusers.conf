# The brightness and volume keys (#80). Debian's triggerhappy reads every keyboard as root, then
# runs /usr/libexec/wros-media-key as this account: the video group may write the screen
# backlight (90-wros-backlight.rules) and the audio group may change the sound card's volume.
u wros-keys - "WrOS brightness and volume keys" / /usr/sbin/nologin
m wros-keys video
m wros-keys audio
