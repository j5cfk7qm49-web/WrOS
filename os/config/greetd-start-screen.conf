# The start screen's progress bar (docs/RATATUI_BOOT.md) hands tty1 to the login.
# Shipped by the wros package, so updates carry it (greetd.service itself is only
# staged into new images). "-": never a reason for the login not to start.
[Service]
ExecStartPre=-/usr/bin/systemctl stop wros-boot-splash.service
