# Brightness and volume keys for triggerhappy (#80). The kernel names these keys the same on every
# computer. Value 1 is a press and 2 a held key repeating; mute acts on the press only.
KEY_BRIGHTNESSUP	1	/usr/libexec/wros-media-key brightness-up
KEY_BRIGHTNESSUP	2	/usr/libexec/wros-media-key brightness-up
KEY_BRIGHTNESSDOWN	1	/usr/libexec/wros-media-key brightness-down
KEY_BRIGHTNESSDOWN	2	/usr/libexec/wros-media-key brightness-down
KEY_VOLUMEUP	1	/usr/libexec/wros-media-key volume-up
KEY_VOLUMEUP	2	/usr/libexec/wros-media-key volume-up
KEY_VOLUMEDOWN	1	/usr/libexec/wros-media-key volume-down
KEY_VOLUMEDOWN	2	/usr/libexec/wros-media-key volume-down
KEY_MUTE	1	/usr/libexec/wros-media-key mute
