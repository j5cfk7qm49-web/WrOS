name: release-nixos-updates

# Publish signed NixOS closure update metadata to GitHub Pages under nixos-updates/
# alongside the existing Debian updates/ path (which stays untouched for rc13 machines).
#
# NOT YET IN USE (rc14). A Pages deployment replaces the whole site, and this job deploys only
# nixos-updates/: run as it is, it would remove the Debian updates/ channel rc13 machines use and
# the phone-link pages. A full NixOS bundle is also about the size of Pages' 1 GB limit. rc14 is
# installed fresh, so there is nothing to update to yet and the app reports the channel as
# unpublished. Before rc15 this folds into release-updates.yml (one site, both channels), with
# the large archives on the release itself. Until then it runs only by hand, and refuses.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Serve this release tag's wros-nixos-updates.tar as nixos-updates/
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wros-nixos-updates-pages
  cancel-in-progress: false

jobs:
  publish-nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: github-pages
    env:
      NIXOS_UPDATE_URL: https://j5cfk7qm49-web.github.io/WrOS/nixos-updates/
    steps:
      - name: Refuse until both channels publish as one site
        run: |
          echo "::error::Deploying nixos-updates/ alone would replace the whole Pages site (Debian updates/, phone-link pages). See the note at the top of this workflow."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release tag and offline-signed NixOS bundle
        id: verify
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          tag="${RELEASE:-$GITHUB_REF_NAME}"
          version=$(python3 -I tools/publish-nixos-updates.py version "$tag")
          mkdir -p out/pages
          if curl -fsSL --proto '=https' -o out/wros-nixos-updates.tar \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/wros-nixos-updates.tar"; then
            python3 -I tools/publish-nixos-updates.py check-bundle out/wros-nixos-updates.tar out/pages/nixos-updates "$version"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No wros-nixos-updates.tar asset attached to $tag yet; skipping deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.verify.outputs.deploy == 'true'
        with:
          path: out/pages
      - uses: actions/deploy-pages@v5
        if: steps.verify.outputs.deploy == 'true'
