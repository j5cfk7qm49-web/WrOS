name: ci

# WrOS is the platform: qualify its Debian 13 amd64 / CPython 3.13 runtime.
# Preserved upstream editor workflows live in docs/upstream-workflows/.

on:
  push:
    branches: [main, development, 'writingdeck/m7b-wip']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: debian:13-slim
      # A real PID 1 that reaps orphans, as systemd does on WrOS: without it the runner's
      # placeholder PID 1 leaves zombies that keep a stopped process group alive.
      options: --init
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Debian prerequisites
        run: |
          # The slim image skips installing documentation; package tests check every file.
          grep -l '^path-exclude' /etc/dpkg/dpkg.cfg.d/* 2>/dev/null | xargs -r rm -f
          sed 's/^Types:.*/Types: deb-src/' /etc/apt/sources.list.d/debian.sources > /etc/apt/sources.list.d/wros-build-sources.sources
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libssl-dev libdrm-dev python3 python3-venv python3-debian python3-apt wordnet-base ca-certificates curl git restic rclone shellcheck gnupg gpgv debian-archive-keyring autoconf automake libtool dpkg-dev patch cpio libdebian-installer4-dev debconf libreoffice-writer-nogui poppler-utils fonts-liberation epubcheck default-jre-headless squashfs-tools \
            grub-common cage foot fakeroot python3-qrcode python3-pil console-setup kbd e2fsprogs \
            libinput-dev libudev-dev libseat-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libegl-mesa0 libgl1-mesa-dri wl-clipboard
          useradd -m -s /bin/bash builder
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          # rustup refuses a $HOME other than root's own; the toolchain still goes to RUSTUP_HOME.
          HOME=/root sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.99.1 --component clippy,rustfmt
          chown -R builder:builder /opt/cargo /opt/rustup "$GITHUB_WORKSPACE"
      - name: Fetch and verify locked build inputs
        shell: bash
        run: |
          runuser -u builder -- env PATH="/opt/cargo/bin:$PATH" bash -c '
            set -e
            cargo fetch --locked
            python3 tools/prepare-prose-tools.py --include-sources
            mkdir -p build/installer-source
            cd build/installer-source
            apt-get source --download-only cdebconf=0.280
          '
      - name: Non-root software qualification
        shell: bash
        run: runuser -u builder -- env PATH="/opt/cargo/bin:$PATH" bash tools/test-m7b.sh
      - name: The app in a terminal and OpenGL window (tests/driven.rs)
        shell: bash
        run: runuser -u builder -- env PATH="/opt/cargo/bin:$PATH" cargo test --locked --no-default-features --features test-driver,gui-wgpu --test driven
      - name: Retain results for this commit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m7b-software-${{ github.sha }}
          path: |
            build/verification/*.log
            build/verification/partial-results.json
            build/verification/installer-components*.json
            build/verification/manuscript-footnotes/
            build/verification/manuscript-footnote-screens/
            build/verification/epub-footnotes/
            build/verification/epub-footnote-screens/
            build/verification/passage-restore-screens/
            build/verification/story-identity-screens/
            build/verification/local-session-privacy-screens/
            build/verification/knowledge-screens/
            build/verification/backup-screens/
            docs/evidence/test-results.json
          if-no-files-found: warn
