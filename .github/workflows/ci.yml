name: ci

# WrOS is the platform: qualify its Debian 13 amd64 / CPython 3.13 runtime.
# Preserved upstream editor workflows live in docs/upstream-workflows/.

on:
  push:
    branches: [main, development, 'writingdeck/m7b-wip']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 45
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Debian prerequisites
        run: |
          sed 's/^Types:.*/Types: deb-src/' /etc/apt/sources.list.d/debian.sources > /etc/apt/sources.list.d/wros-build-sources.sources
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libssl-dev libdrm-dev python3 python3-venv python3-debian python3-apt wordnet-base ca-certificates curl git shellcheck gpgv debian-archive-keyring autoconf automake libtool dpkg-dev patch cpio libdebian-installer4-dev debconf libreoffice-writer-nogui poppler-utils fonts-liberation epubcheck default-jre-headless
          useradd -m -s /bin/bash builder
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.99.1 --component clippy,rustfmt
          chown -R builder:builder /opt/cargo /opt/rustup "$GITHUB_WORKSPACE"
      - name: Fetch and verify locked build inputs
        shell: bash
        run: |
          runuser -u builder -- env PATH="/opt/cargo/bin:$PATH" bash -c '
            set -e
            cargo fetch --locked
            python3 tools/prepare-prose-tools.py --include-sources
            mkdir -p build/installer-source
            cd build/installer-source
            apt-get source --download-only cdebconf=0.280
          '
      - name: Non-root software qualification
        shell: bash
        run: runuser -u builder -- env PATH="/opt/cargo/bin:$PATH" bash tools/test-m7b.sh
      - name: Retain results for this commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7b-software-${{ github.sha }}
          path: |
            build/verification/*.log
            build/verification/partial-results.json
            build/verification/installer-components*.json
            build/verification/manuscript-footnotes/
            build/verification/manuscript-footnote-screens/
            build/verification/epub-footnotes/
            build/verification/epub-footnote-screens/
            docs/evidence/test-results.json
          if-no-files-found: warn
