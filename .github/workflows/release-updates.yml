name: release-updates

# Publish the qualified release package to GitHub Pages as a flat apt repository.
# Design: docs/archive/superpowers/specs/2026-11-01-online-wros-updates-design.md
#
# Pages replaces the whole site on every deploy, so each run republishes the live
# updates/ folder: a tag serves its offline-signed asset, and a refresh re-signs the package already there
# (after checking it against the committed keyring and pin).
#
# Until the WROS_UPDATE_SIGNING_SUBKEY secret is set, CI signs nothing: a release tag
# (or a dispatch naming one) serves the release's wros-updates.tar asset, signed offline
# with the pinned key, unchanged and only after checking it; other runs deploy nothing,
# so Pages keeps serving the last deploy.

on:
  push:
    tags: ['v*', '!v*-linktest*']  # a -linktest tag only carries the link test page; dispatch it by hand
  schedule:
    - cron: '17 6 * * 1'  # weekly re-sign: Valid-Until (21 days) never lapses
  workflow_dispatch:
    inputs:
      scratch:
        description: Also build this ref into updates-scratch/ (updates/ is only re-signed)
        type: boolean
        default: true
      release:
        description: Serve this release tag's wros-updates.tar as updates/ (signed offline), instead
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wros-updates-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 60
    environment: github-pages
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
      DEBIAN_FRONTEND: noninteractive
      UPDATE_URL: https://j5cfk7qm49-web.github.io/WrOS/updates/
    steps:
      - name: Debian prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libasound2-dev libssl-dev libdrm-dev \
            libinput-dev libudev-dev libseat-dev libxkbcommon-dev \
            python3 python3-debian ca-certificates curl git gnupg gpgv dpkg-dev console-setup keyboard-configuration
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Plan this run
        id: plan
        shell: bash
        env:
          SIGNING: ${{ secrets.WROS_UPDATE_SIGNING_SUBKEY != '' }}
          SCRATCH: ${{ inputs.scratch }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          build=''
          version=''
          release=''
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python3 tools/publish-updates.py version "$GITHUB_REF_NAME")
            release=$GITHUB_REF_NAME
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$RELEASE" ]; then
            version=$(python3 tools/publish-updates.py version "$RELEASE")
            release=$RELEASE
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$SCRATCH" = true ] && [ "$SIGNING" = true ]; then
            build=updates-scratch
            version=$(head -n1 os/VERSION)
          fi
          sign=false
          deploy=false
          if [ -n "$release" ]; then
            deploy=true
          elif [ "$SIGNING" = true ]; then
            sign=true
            deploy=true
          else
            echo "::notice::No signing subkey: nothing is signed or deployed; Pages keeps the last deploy"
          fi
          {
            echo "build=$build"
            echo "version=$version"
            echo "release=$release"
            echo "sign=$sign"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
      - name: Pinned Rust toolchain
        if: steps.plan.outputs.build != ''
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          # rustup refuses a $HOME other than root's own; the toolchain still goes to RUSTUP_HOME.
          HOME=/root sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain 1.99.1
      - name: Build the wros package
        if: steps.plan.outputs.build != ''
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          export PATH="/opt/cargo/bin:$PATH"
          cargo build --release --locked --no-default-features --features gui-drm -p grimoire-tui -p wros-greeter -p wros-boot
          mkdir -p out/bin out/new
          cp target/release/grimoire target/release/wros-greeter target/release/wros-boot out/bin/
          python3 -I tools/build-wros-debs.py --binaries-dir out/bin --version "$VERSION" --output out/new
      - name: Serve the release's offline-signed bundle
        if: steps.plan.outputs.release != ''
        shell: bash
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out/pages
          # The tag can arrive a moment before its release asset does.
          for attempt in $(seq 1 30); do
            if curl -fsSL --proto '=https' -o out/wros-updates.tar \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/wros-updates.tar"; then
              break
            fi
            [ "$attempt" -lt 30 ] || { echo "no wros-updates.tar on release $RELEASE" >&2; exit 1; }
            sleep 20
          done
          python3 -I tools/publish-updates.py check-bundle out/wros-updates.tar out/pages/updates "$VERSION"
          find out/pages -type f | sort
      - name: Import the CI signing subkey
        if: steps.plan.outputs.sign == 'true'
        shell: bash
        env:
          SUBKEY: ${{ secrets.WROS_UPDATE_SIGNING_SUBKEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/wros-gnupg.XXXXXX")
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          if ! printf '%s\n' "$SUBKEY" | gpg --batch --import >/dev/null 2>&1; then
            echo 'Could not import the signing subkey.' >&2
            exit 1
          fi
          if ! gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '
            $1 == "sec" { keys++; if ($15 != "#") bad = 1 }
            $1 == "ssb" && $15 == "+" { subkeys++; if ($12 !~ /s/ || $2 ~ /[erdi]/) bad = 1 }
            END { exit !(keys == 1 && subkeys == 1 && !bad) }
          '; then
            echo 'Supply an export containing only one usable signing subkey.' >&2
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          trap - EXIT
      - name: Sign into the site
        if: steps.plan.outputs.sign == 'true'
        shell: bash
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set -euo pipefail
          PIN=$(grep -v '^#' os/config/update-trust/update-signers | tr -d ' \n')
          sign() {
            python3 -I tools/build-update-bundle.py "$1" --out "$2" --gnupg-home "$GNUPGHOME" \
              --key-id "$PIN" --expect-fingerprint "$PIN" --valid-days 21
            keyring="$GITHUB_WORKSPACE/os/config/update-trust/wros-archive-keyring.gpg"
            gpgv --keyring "$keyring" "$2/InRelease" >/dev/null 2>&1
            gpgv --keyring "$keyring" "$2/Release.gpg" "$2/Release" >/dev/null 2>&1
          }
          mkdir -p out/pages out/live
          live=$(python3 tools/publish-updates.py published "$UPDATE_URL" out/live)
          [ -n "$live" ] || { echo 'No published update to refresh.' >&2; exit 1; }
          sign "$live" out/pages/updates
          if [ "$BUILD" = updates-scratch ]; then
            sign out/new/wros_*_amd64.deb out/pages/updates-scratch
          fi
          find out/pages -type f | sort
      - name: Remove signing material from the runner
        if: always() && steps.plan.outputs.sign == 'true'
        shell: bash
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --kill gpg-agent
            rm -rf -- "$GNUPGHOME"
          fi
      - name: Static pages
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pages
          cp -r pages/. out/pages/
          find out/pages -type f | sort
      - uses: actions/upload-pages-artifact@v5
        if: steps.plan.outputs.deploy == 'true'
        with:
          path: out/pages
      - uses: actions/deploy-pages@v5
        if: steps.plan.outputs.deploy == 'true'
