name: release-updates

# Publish the offline-signed NixOS update channel (nixos-updates/) and static pages
# to GitHub Pages. See docs/NIXOS_UPDATES.md.
#
# Pages replaces the whole site on every deploy, so both parts must be ready before
# upload. A pushed tag or the nixos_release dispatch input selects the release.
# The weekly run checks the published channel's expiry.

on:
  push:
    tags: ['v*', '!v*-linktest*']  # a -linktest tag only carries the link test page; dispatch it by hand
  schedule:
    - cron: '17 6 * * 1'  # weekly expiry check for the published NixOS channel
  workflow_dispatch:
    inputs:
      nixos_release:
        description: Serve this release's signed NixOS update bundle as nixos-updates/
        type: string
        default: ''

concurrency:
  group: wros-updates-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the published NixOS channel expiry
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url=https://j5cfk7qm49-web.github.io/WrOS/nixos-updates/InRelease
          mkdir -p out
          curl -fsSL --proto '=https' -o out/InRelease "$url"
          expiry=$(python3 -I tools/publish-nixos-updates.py days-left out/InRelease --with-date)
          read -r days_left expires_on <<< "$expiry"
          title="NixOS update channel expires on $expires_on"
          if [ "$days_left" -ge 10 ]; then
            echo "$title (UTC, $days_left whole days left)."
            exit 0
          fi
          renew='Publish a new WrOS release or re-sign offline and publish the refreshed NixOS bundle.'
          echo "::error::$title (UTC, $days_left whole days left). $renew"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json title \
            --jq ".[] | select(.title == \"$title\") | .title")
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "The live channel at $url expires on $expires_on (UTC). $renew"
          fi
          exit 1
      - name: Plan this run
        id: plan
        shell: bash
        env:
          NIXOS: ${{ inputs.nixos_release }}
        run: |
          set -euo pipefail
          nixos=''
          nixos_version=''
          deploy=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            nixos=$GITHUB_REF_NAME
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            nixos=$NIXOS
          fi
          if [ -n "$nixos" ]; then
            nixos_version=$(python3 tools/publish-nixos-updates.py version "$nixos")
            deploy=true
          else
            echo "::notice::No NixOS release named: nothing is deployed; Pages keeps the last deploy"
          fi
          {
            echo "nixos=$nixos"
            echo "nixos_version=$nixos_version"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
      - name: Serve the NixOS release's offline-signed channel
        if: steps.plan.outputs.nixos != ''
        shell: bash
        env:
          NIXOS: ${{ steps.plan.outputs.nixos }}
          NIXOS_VERSION: ${{ steps.plan.outputs.nixos_version }}
        run: |
          set -euo pipefail
          mkdir -p out/pages
          # From rc24 a release can carry a thin bundle (#169): Pages serves it, and laptops fetch
          # the upstream packages it lists from cache.nixos.org. The full one stays a release
          # asset for update sticks, and is what Pages serves when there is no thin one.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$NIXOS"
          for attempt in $(seq 1 30); do
            if curl -fsSL --proto '=https' -o out/wros-nixos-updates.tar "$base/wros-nixos-updates-thin.tar" \
                || curl -fsSL --proto '=https' -o out/wros-nixos-updates.tar "$base/wros-nixos-updates.tar"; then
              break
            fi
            [ "$attempt" -lt 30 ] || { echo "no wros-nixos-updates.tar on release $NIXOS" >&2; exit 1; }
            sleep 20
          done
          python3 -I tools/publish-nixos-updates.py check-bundle out/wros-nixos-updates.tar out/pages/nixos-updates "$NIXOS_VERSION"
          # rc14's updater downloads only from Pages (it refuses redirects, so no release
          # assets), and Pages refuses files over 100 MB.
          big=$(find out/pages/nixos-updates -type f -size +99M)
          [ -z "$big" ] || { echo "too large for Pages: $big" >&2; exit 1; }
          du -sh out/pages/nixos-updates
      - name: Static pages
        if: steps.plan.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pages
          cp -r pages/. out/pages/
          # All or nothing: this deploy replaces everything that was on Pages.
          for part in index.html l/index.html nixos-updates/InRelease nixos-updates/closure-manifest.json; do
            [ -f "out/pages/$part" ] || { echo "Pages would lack $part" >&2; exit 1; }
          done
          total=$(du -sm out/pages | cut -f1)
          [ "$total" -lt 950 ] || { echo "Pages would hold ${total} MB; it allows 1 GB" >&2; exit 1; }
          find out/pages -type f | sort
      - uses: actions/upload-pages-artifact@v5
        if: steps.plan.outputs.deploy == 'true'
        with:
          path: out/pages
      - uses: actions/deploy-pages@v5
        if: steps.plan.outputs.deploy == 'true'
