[package]
name = "grimoire-core"
version.workspace = true
edition = "2024"
description = "The book on disk behind Grimoire: project, editor, history, export, search"
authors = ["Josh King"]
license = "MIT"
repository = "https://github.com/kelsierbot/GrimoireTUI"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "=0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spellbook = "0.4.2"
toml = "1.1.6"
unicode-width = "0.2.2"
similar = "2"
sha2 = "=0.10.9"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
unicode-normalization = "0.1"
unicode-segmentation = "=1.13.3"
# Reading a Word draft brought in as a new book.
roxmltree = "0.21"


# Opt-in local grammar service; includes Harper's bundled POS/chunker models.
# No engine initialization or manuscript transmission in ordinary spelling.
harper-core = { version = "=2.13.0", default-features = false, features = ["concurrent"] }
pulldown-cmark = { version = "=0.13.3", default-features = false }

# Pin the bundled model/runtime contract as well as its public adapter.
# These are also reached transitively by harper-core.
harper-brill = "=2.13.0"
harper-pos-utils = { version = "=2.13.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
