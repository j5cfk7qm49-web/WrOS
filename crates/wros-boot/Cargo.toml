[package]
name = "wros-boot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WrOS start screens drawn with Ratatui: the disk password and the progress bar, with Debian's prompt behind them"

[lints]
workspace = true

[dependencies]
wros-shell = { workspace = true }
ratatui = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
wros-graphics = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
vt100 = { workspace = true }
