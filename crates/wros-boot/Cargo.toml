[package]
name = "wros-boot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WrOS start screens drawn with Ratatui: the disk password and the progress bar, with Debian's prompt behind them"

[dependencies]
wros-shell = { path = "../wros-shell" }
ratatui = "0.30.2"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wros-graphics = { path = "../wros-graphics" }

[dev-dependencies]
insta = "1.49"
vt100 = "0.18"
