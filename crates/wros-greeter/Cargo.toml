[package]
name = "wros-greeter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WrOS login screen: the Lemurs login form on greetd; no editor or password verification"

[lints]
workspace = true

[dependencies]
wros-shell = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }
wros-graphics = { workspace = true }
