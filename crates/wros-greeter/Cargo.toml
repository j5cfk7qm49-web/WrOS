[package]
name = "wros-greeter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WrOS login screen: the Lemurs login form on greetd; no editor or password verification"

[dependencies]
wros-shell = { path = "../wros-shell" }
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
signal-hook = "0.3"
wros-graphics = { path = "../wros-graphics" }
