[package]
name = "wros-installer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Grimoire presentation for Debian Installer's passthrough frontend"

[lints]
workspace = true

[dependencies]
wros-shell = { workspace = true }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
