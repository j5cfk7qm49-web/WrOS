[package]
name = "wros-shell"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared WrOS presentation and navigation without editor, authentication or privilege dependencies"

[dependencies]
ratatui = "0.30.2"
serde = { version = "1.0", features = ["derive"] }
# Conversion only: the disk-password screen must never query terminal input.
termprofile = { version = "0.2.5", default-features = false, features = ["convert", "ratatui"] }

[dev-dependencies]
serde_json = "1.0"
