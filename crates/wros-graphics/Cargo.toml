[package]
name = "wros-graphics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WrOS software rendering to Linux DRM/KMS"

[lints]
workspace = true

[dependencies]
ratatui = { workspace = true }
soft_ratatui = { version = "0.2.0", default-features = false }
rustc-hash = "2.1"
unicode-width = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
flate2 = { workspace = true, default-features = true }
unicode-width = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"
libc = { workspace = true }
signal-hook = { workspace = true }
