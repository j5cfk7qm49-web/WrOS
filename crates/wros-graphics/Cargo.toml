[package]
name = "wros-graphics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WrOS software rendering to Linux DRM/KMS"

[dependencies]
ratatui = "0.30.2"
soft_ratatui = { version = "0.2.0", default-features = false }
rustc-hash = "2.1"
unicode-width = "0.2"

[build-dependencies]
flate2 = "1.1"
unicode-width = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"
libc = "0.2"
signal-hook = "0.3"
