[package]
name = "wros-google"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline-testable Google enrollment core for WrOS: protected per-user credentials and the OAuth device flow"

[dependencies]
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
