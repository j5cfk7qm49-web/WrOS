[package]
name = "wros-input"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Unprivileged terminal reader retirement and explicit input ownership for WrOS"

[[test]]
name = "ownership"
path = "tests/ownership.rs"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
crossterm = { version = "0.29", features = ["serde"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"
