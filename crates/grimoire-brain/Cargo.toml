description = "Brain operations and reference model for Grimoire"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
loro = { version = "=1.18.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
