[package]
name = "grimoire-brain"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Brain operations and reference model for Grimoire"
publish = false

[lints]
workspace = true

[features]
runtime = ["dep:rusqlite", "dep:tempfile"]
qualification = ["runtime", "dep:automerge", "rusqlite/backup"]

[[bin]]
name = "brain-bench"
path = "src/bin/brain-bench.rs"
required-features = ["qualification"]

[dependencies]
automerge = { version = "=0.12.0", default-features = false, optional = true }
chrono = { workspace = true, features = ["serde", "std"] }
fsrs = "=6.6.2"
loro = { version = "=1.18.0", default-features = false }
rusqlite = { version = "=0.43.0", features = ["bundled"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = { workspace = true }
