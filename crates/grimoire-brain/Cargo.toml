[package]
name = "grimoire-brain"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Brain operations and reference model for Grimoire"
publish = false

[features]
qualification = ["dep:rusqlite", "dep:tempfile"]

[[bin]]
name = "brain-bench"
path = "src/bin/brain-bench.rs"
required-features = ["qualification"]

[dependencies]
automerge = { version = "=0.12.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
loro = { version = "=1.18.0", default-features = false }
rusqlite = { version = "=0.43.0", features = ["backup", "bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = { version = "3", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
